<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel administrativo — IDPetScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" type="image/png" href="{% static 'img/logo-mark.png' %}">
</head>
<body>
<div class="admin-shell">
  <div class="admin-side">
    <div class="admin-brand">
      <img src="{% static 'img/logo-mark.png' %}" alt="">
      <span>IDPetScan Admin</span>
    </div>
    <a href="{% url 'backoffice:solicitudes' %}" class="admin-nav-item {% if active == 'solicitudes' %}active{% endif %}">📋 Solicitudes</a>
    <a href="{% url 'backoffice:mascotas' %}" class="admin-nav-item {% if active == 'mascotas' %}active{% endif %}">🐾 Mascotas</a>
    <a href="{% url 'backoffice:ordenes' %}" class="admin-nav-item {% if active == 'ordenes' %}active{% endif %}">🛒 Órdenes</a>
    <a href="{% url 'backoffice:usuarios' %}" class="admin-nav-item {% if active == 'usuarios' %}active{% endif %}">👤 Usuarios</a>
    <form method="post" action="{% url 'accounts:logout' %}" style="margin-top:auto;padding-top:20px;">
      {% csrf_token %}
      <button type="submit" class="admin-nav-item" style="width:100%;text-align:left;background:none;border:none;cursor:pointer;font-family:inherit;">🚪 Cerrar sesión</button>
    </form>
  </div>
  <div class="admin-main">
    {% block admin_content %}{% endblock %}
  </div>
</div>
</body>
</html>
