{% extends "backoffice/base.html" %}
{% block admin_content %}
<div class="admin-head"><div><h2>Usuarios registrados</h2><p>{{ users|length }} cuentas</p></div></div>
<table class="admin-table">
  <thead><tr><th>Usuario</th><th>Correo</th><th>Mascotas</th><th>Registrado</th></tr></thead>
  <tbody>
    {% for u in users %}
    <tr>
      <td><b>{{ u.username }}</b></td>
      <td>{{ u.email|default:"—" }}</td>
      <td>{{ u.pet_count }}</td>
      <td>{{ u.date_joined|date:"d M Y" }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
