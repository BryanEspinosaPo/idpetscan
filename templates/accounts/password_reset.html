{% extends "base.html" %}
{% block content %}
<div class="auth-wrapper">
  <div class="auth-side">
    <img src="{% load static %}{% static 'img/logo-stacked.png' %}" style="width:200px;margin-bottom:24px;" alt="IDPetScan">
    <p class="quote">Te enviaremos un link para que puedas crear una nueva contraseña.</p>
  </div>
  <div class="auth-form">
    <h2>Recuperar contraseña</h2>
    <p class="sub">Ingresa el correo con el que te registraste.</p>
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>Correo electrónico</label>{{ form.email }}</div>
      <button type="submit" class="auth-btn">Enviar link de recuperación</button>
    </form>
    <p class="auth-alt"><a href="{% url 'accounts:login' %}">Volver a iniciar sesión</a></p>
  </div>
</div>
{% endblock %}
