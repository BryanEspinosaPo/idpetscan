<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IDPetScan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="icon" type="image/png" href="{% static 'img/logo-mark.png' %}">
</head>
<body>

  <div class="page-loader" id="page-loader">
    <img src="{% static 'img/loader.gif' %}" alt="Cargando...">
  </div>

  <div class="site-header">
    <a href="{% url 'home' %}" class="brand-link">
      <img src="{% static 'img/logo-horizontal.png' %}" class="brand-logo-full" alt="IDPetScan">
    </a>
    <div class="site-header-actions">
      {% if user.is_authenticated %}
        <a href="{% url 'pets:my_pets' %}" class="btn btn-ghost">Mis mascotas</a>
        <form method="post" action="{% url 'accounts:logout' %}" style="margin:0;">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost">Cerrar sesión</button>
        </form>
      {% else %}
        <a href="{% url 'accounts:register' %}" class="btn btn-ghost">Registrarme</a>
        <a href="{% url 'accounts:login' %}" class="btn btn-primary">Ingresar</a>
      {% endif %}
    </div>
  </div>

  {% block content %}{% endblock %}

  <script>
    window.addEventListener('load', function () {
      var loader = document.getElementById('page-loader');
      setTimeout(function () { loader.classList.add('hidden'); }, 350);
    });
  </script>
</body>
</html>
